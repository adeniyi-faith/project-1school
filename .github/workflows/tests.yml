name: Tests

# Runs every test on each pull request, and before each deploy (deploy.yml waits for it),
# so a change that breaks something is caught before it reaches the live site.
on:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath, fileinfo
          coverage: none

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Pages rendered in the tests need the built front end
      - name: Build the front end
        run: |
          npm ci
          npm run build

      - name: Run the front-end tests
        run: npm test

      - name: Run the tests
        run: php vendor/bin/phpunit
