name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Upload compiled assets to cPanel via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          source: "public/build"
          target: "/home2/rainofbl/public_html/school.criticalinfo.com.ng"
          strip_components: 0

      - name: Run post-deployment commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            export PATH="$HOME/bin:$PATH"
            cd /home2/rainofbl/public_html/school.criticalinfo.com.ng
            git pull origin main
            /opt/cpanel/ea-php82/root/usr/bin/php -d allow_url_fopen=1 -d memory_limit=-1 $HOME/bin/composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs
            /opt/cpanel/ea-php82/root/usr/bin/php artisan storage:link 2>/dev/null || true
            /opt/cpanel/ea-php82/root/usr/bin/php artisan config:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan route:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan view:cache
