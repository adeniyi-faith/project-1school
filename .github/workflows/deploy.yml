name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to cPanel
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            export PATH="$HOME/bin:$PATH"
            cd /home2/rainofbl/public_html/school.criticalinfo.com.ng
            git pull origin main
            /opt/alt/php83/usr/bin/php -d allow_url_fopen=1 -d memory_limit=-1 $HOME/bin/composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs
            /opt/alt/php83/usr/bin/php artisan storage:link 2>/dev/null || true
            /opt/alt/php83/usr/bin/php artisan config:cache
            /opt/alt/php83/usr/bin/php artisan route:cache
            /opt/alt/php83/usr/bin/php artisan view:cache
